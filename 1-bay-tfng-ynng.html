<head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme: light; }
  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#edeadf; --fg:#262319; --fg-dim:#696152;
    --accent:#8a4f3a; --accent-fg:#ffffff; --accent-soft:#f0ddd2;
    --ok:#2f7a4f; --ok-soft:#dcefe0; --bad:#b4302f; --bad-soft:#f6dcda;
    --border:#ddd6c3; --shadow:0 1px 2px rgba(30,30,10,.06), 0 8px 24px rgba(30,30,10,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
      --accent:#e3a07e; --accent-fg:#1f1109; --accent-soft:#3a2a1d;
      --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
      --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
    --accent:#e3a07e; --accent-fg:#1f1109; --accent-soft:#3a2a1d;
    --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
    --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; margin:0; padding-inline:16px; padding-block:24px; line-height:1.55}
  h1,h2,h3{font-family:Fraunces,Georgia,serif; font-weight:600; text-wrap:balance; margin:0 0 .4em}
  .wrap{max-width:760px; margin:0 auto}
  p{margin:.5em 0}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px}
  [hidden]{display:none!important}

  #gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
  #gate .box{max-width:380px; width:100%; text-align:center}
  #gate input{width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg); margin:14px 0}
  #gate button{width:100%; font-size:16px; font-weight:600; padding:12px 14px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  #gate .emoji{font-size:40px}

  nav.tabs{display:flex; gap:8px; max-width:760px; margin:0 auto 16px; overflow-x:auto}
  nav.tabs button{flex:1; white-space:nowrap; font:inherit; font-weight:600; font-size:14px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg-dim); cursor:pointer}
  nav.tabs button.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}

  .lede{color:var(--fg-dim); font-style:italic; border-left:3px solid var(--accent); padding-left:12px; margin:0 0 20px}
  .groupTitle{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-dim); margin:22px 0 10px; display:flex; align-items:center; gap:8px}
  .groupTitle::after{content:""; flex:1; height:1px; background:var(--border)}

  .acc{border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface)}
  .acc-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; cursor:pointer; font-weight:600}
  .acc-h .tag{font-size:.75rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; margin-right:8px}
  .acc-h .chev{transition:transform .2s; color:var(--fg-dim); flex:0 0 auto}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease}
  .acc.open .acc-body{max-height:4000px}
  .acc-inner{padding:0 16px 16px}
  .acc-inner h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-dim); margin:12px 0 6px}
  .acc-inner ul{margin:0; padding-left:18px}
  .acc-inner li{margin-bottom:8px}
  .fixbox{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin-top:6px; font-size:.94rem}
  .exbox{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:8px; padding:8px 12px; margin:6px 0; font-size:.92rem}
  .exbox b{color:var(--accent)}
  table.vt{width:100%; border-collapse:collapse; font-size:.88rem; margin:8px 0}
  table.vt th, table.vt td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border)}
  table.vt th{color:var(--fg-dim); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em}
  .note-card{background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:.95rem}

  .qcard{margin-bottom:14px}
  .qcard .qtext{font-weight:600; margin-bottom:10px}
  .opt{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:3px}
  .opt.correct{background:var(--ok-soft); border-color:var(--ok)}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .fb{display:none; margin-top:8px; padding:10px 12px; border-radius:10px; font-size:.92rem}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft); color:var(--ok)}
  .fb.bad{background:var(--bad-soft); color:var(--bad)}
  button.primary{font:inherit; font-weight:600; font-size:15px; padding:12px 18px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  button.primary:disabled{opacity:.5; cursor:not-allowed}
  .scorebox{text-align:center; padding:24px 16px}
  .scorebox .num{font-family:Fraunces,serif; font-size:2.6rem; color:var(--accent)}
  .note{color:var(--fg-dim); font-size:.85rem; margin-top:10px}
</style>
</head>

<div class="wrap" id="appRoot" hidden>
  <h1 style="font-size:1.5rem">Bẫy T/F/NG · Y/N/NG Chuyên Sâu</h1>
  <p class="lede">Đào sâu 2 dạng học sinh sai nhiều nhất: True/False/Not Given và Yes/No/Not Given — toàn bộ ví dụ là ví dụ THẬT, kèm ngân hàng paraphrase cốt lõi.</p>

<script>
(function(){
"use strict";
var LESSON_ID = "sau-tfng-ynng";
var studentName = "";
function $(id){ return document.getElementById(id); }

var READ_HTML = "\n<div class=\"note-card\"><b>Cách học trang này:</b> đọc theo đúng thứ tự từ trên xuống — mỗi phần được xây dựng dựa trên phần vừa học trước đó, không phải một danh sách bẫy rời rạc để học thuộc ngẫu nhiên. Đi hết một lượt rồi mới sang tab \"Luyện nhận diện\".</div>\n\n<div class=\"groupTitle\">TRUE / FALSE / NOT GIVEN</div>\n\n<div class=\"acc open\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 1</span>Hiểu đúng bản chất trước khi học bẫy</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Trước khi nhìn vào bất kỳ \"mẹo\" hay \"bẫy\" nào, em cần trả lời được câu hỏi gốc: <b>T/F/NG đang kiểm tra cái gì?</b> Câu trả lời: kiểm tra <b>SỰ KIỆN khách quan</b> được nêu trong bài — tức những điều bài đọc TƯỜNG THUẬT là có thật, không phải quan điểm hay đánh giá của ai cả.</p>\n    <p>Ba nhãn của dạng này tương ứng với ba tình huống:</p>\n    <ul>\n      <li><b>True</b> — câu hỏi và bài đọc thống nhất hoàn toàn, dù cách diễn đạt có thể khác nhau (gọi là paraphrase — em sẽ gặp lại khái niệm này ở hầu như mọi bẫy bên dưới).</li>\n      <li><b>False</b> — câu hỏi dùng đúng những từ/cụm quen thuộc với bài, nhưng khi đối chiếu kỹ, <b>nội dung lại đối lập</b> với những gì bài nói.</li>\n      <li><b>Not Given</b> — cụm từ trong câu hỏi nghe rất quen vì gần giống bài, nhưng bài <b>không hề xác nhận cũng không phủ nhận</b> đúng cái ý mà câu hỏi đang hỏi.</li>\n    </ul>\n    <p>Hầu hết lỗi sai không đến từ việc không hiểu ba nhãn này — mà từ việc nhận diện sai TÌNH HUỐNG nào đang xảy ra. Vì vậy, bước tiếp theo là một quy trình làm bài cụ thể, giúp em luôn xác định đúng tình huống trước khi chọn nhãn.</p>\n    <h4>Quy trình 4 bước — làm theo đúng thứ tự này cho mọi câu</h4>\n    <ul>\n      <li><b>1.</b> Đọc câu hỏi TRƯỚC, xác định từ khoá của riêng câu đó — làm từng câu một, tuyệt đối không đọc gộp nhiều câu cùng lúc.</li>\n      <li><b>2.</b> Tìm đoạn liên quan trong bài — và luôn nhớ: phần này gần như chắc chắn đã bị diễn đạt lại (paraphrase), đừng trông chờ thấy nguyên văn.</li>\n      <li><b>3.</b> Đối chiếu cẩn thận: ý trong bài và ý trong câu hỏi đang CÙNG NHAU, NGƯỢC NHAU, hay bài không có đủ dữ kiện để kết luận?</li>\n      <li><b>4.</b> Thứ tự câu hỏi luôn đi theo đúng thứ tự xuất hiện trong bài — nếu thấy mình \"lạc\" không tìm ra đoạn liên quan, quay lại đúng vị trí của câu ngay trước đó, đáp án thường nằm ngay sau.</li>\n    </ul>\n    <p>Quy trình này chính là \"bộ lọc\" giúp em phát hiện 6 kiểu bẫy dưới đây — mỗi bẫy chỉ là một cách cụ thể mà bước 3 (đối chiếu) có thể bị đánh lừa. Ta đi từ bẫy DỄ nhận ra nhất đến bẫy TINH VI nhất.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 2</span>Bẫy dễ nhận ra nhất: đối lập trực tiếp</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Bắt đầu với kiểu bẫy đơn giản nhất: một từ định lượng hoặc định tính trong câu hỏi bị đổi NGƯỢC NGHĨA so với bài, trong khi toàn bộ phần câu còn lại được giữ nguyên y hệt — khiến câu hỏi đọc lên vẫn rất \"quen tai\".</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Barn owls are <b>fatter</b> than true owls.\"<br><b>Bài gốc:</b> \"Barn owls are...<b>skinnier</b> than their characteristically fluffy and round counterparts.\"<br><b>Đáp án:</b> False</div>\n    <p>Cách phát hiện: áp dụng bước 3 của quy trình — khi đối chiếu, em sẽ thấy ngay hai ý đối lập nhau (fatter ↔ skinnier). Đây là lỗi dễ sửa nhất vì chỉ cần đọc kỹ, không cần suy luận thêm. Bẫy tiếp theo khó hơn một chút: thay vì đổi nghĩa MỘT từ, nó đổi chiều của cả MỘT MỐI QUAN HỆ.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 3</span>Đảo chiều nhân–quả</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Ở đây, câu hỏi không đổi nghĩa một từ đơn lẻ, mà đảo ngược vai trò: ai là NGUYÊN NHÂN, ai là KẾT QUẢ.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Atari developed arcade games <b>using the profits from</b> home video games.\"<br><b>Thực tế trong bài:</b> chính lợi nhuận từ arcade mới tài trợ ngược lại cho mảng home console — chiều quan hệ bị đảo lại hoàn toàn.<br><b>Đáp án:</b> False</div>\n    <p>Mẹo nhận diện: bất cứ khi nào câu hỏi có cấu trúc \"A gây ra B\" hoặc \"A dùng B để làm C\", hãy tạm dừng và tự hỏi — trong bài, chiều quan hệ này có đúng như vậy không, hay đã bị đảo ngược? Sau nhân-quả, bẫy kế tiếp chuyển sang một loại chi tiết khác: con số và phương hướng.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 4</span>Hướng / số liệu bị đổi</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Tương tự bẫy đối lập trực tiếp, nhưng lần này chi tiết bị đổi là một con số, một địa danh, hoặc một phương hướng — những thứ rất dễ đọc lướt qua nếu không chủ động để ý.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"...tracks went <b>south</b>...\"<br><b>Bài gốc:</b> \"...heading <b>east</b> over the Sierra Nevada Mountains.\"<br><b>Đáp án:</b> False</div>\n    <p>Ba bẫy vừa rồi (đối lập, nhân-quả, số liệu/hướng) đều có điểm chung: bài có nhắc đến chuyện đó, chỉ là NÓI NGƯỢC LẠI — nên đáp án luôn là False. Từ bẫy tiếp theo trở đi, câu chuyện sẽ khác: bài hoàn toàn không xác nhận cũng không phủ nhận, nên đáp án chuyển sang Not Given. Đây là ranh giới quan trọng nhất mà học sinh hay nhầm lẫn.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 5</span>Ví dụ → bị thổi phồng thành khẳng định tổng quát</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Bài chỉ đưa ra MỘT ví dụ cụ thể, nhưng câu hỏi khái quát hoá nó thành \"phổ biến nhất\", \"luôn luôn\", hay \"duy nhất\". Khác với ba bẫy trước, bài không hề nói ngược lại — bài chỉ đơn giản là KHÔNG xếp hạng, KHÔNG khẳng định mức độ. Đó là lý do đáp án là Not Given chứ không phải False.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"A list of words is <b>the most common</b> item used...\"<br><b>Bài gốc:</b> chỉ nói đây là MỘT ví dụ (\"such as a list of words\"), không hề xếp hạng mức độ phổ biến.<br><b>Đáp án:</b> Not Given</div>\n    <p class=\"fixbox\">⚠️ Đây là bẫy hay bị nhầm thành False nhất, vì câu hỏi \"nghe rất quen\" — học sinh thấy quen liền nghĩ bài đang nói đúng điều này nên vội kết luận. Thói quen cần luyện: gạch chân mọi từ giới hạn phạm vi như \"the most\", \"only\", \"always\" ngay khi đọc câu hỏi, và tự hỏi \"bài có thực sự xếp hạng/khẳng định mức độ này không, hay chỉ đưa ra một ví dụ?\"</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 6</span>Sai thì / sai thời điểm</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Cùng họ với bẫy vừa rồi (đáp án vẫn thường là Not Given) nhưng lần này yếu tố bị lệch là THỜI GIAN: bài nói về QUÁ KHỨ, câu hỏi hỏi về HIỆN TẠI — hoặc ngược lại.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Rainfall is currently <b>not possible</b> on Mars.\"<br><b>Bài gốc:</b> \"Mars experienced...rainfall <b>several billion years ago</b>\" — bài không hề nói gì về hiện tại.<br><b>Đáp án:</b> Not Given</div>\n    <p class=\"fixbox\">⚠️ Luyện thói quen gạch chân các từ chỉ thời gian — \"currently\", \"recently\", \"so far\", \"used to\" — ở CẢ câu hỏi lẫn câu gốc trong bài, rồi so sánh xem hai mốc thời gian có thực sự trùng nhau không.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 7</span>Bẫy tinh vi nhất của nhóm này: từ giới hạn tuyệt đối</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là biến thể khó nhất trong nhóm \"ví dụ/phạm vi\": câu hỏi thu hẹp một danh sách thành \"chỉ một / duy nhất\", trong khi bài gốc liệt kê nhiều hơn một đối tượng mà không hề xếp hạng cái nào là duy nhất.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Cotton became America's <b>biggest</b> industry...\" — bài gốc không hề xếp hạng ngành nào lớn nhất.<br>Hoặc: \"Cancer is <b>the only</b> disease...\" — trong khi bài liệt kê 4 trong số 5 loại bệnh khác.<br><b>Đáp án:</b> Not Given / False tuỳ bối cảnh cụ thể của từng bài.</div>\n  </div></div>\n</div>\n\n<div class=\"note-card\">Tới đây em đã đi hết 6 bẫy của T/F/NG — theo đúng trình tự từ dễ nhận ra nhất (đối lập trực tiếp) đến tinh vi nhất (từ giới hạn tuyệt đối). Bây giờ ta chuyển sang dạng \"anh em song sinh\" của nó: Yes/No/Not Given — nhìn bề ngoài gần giống hệt, nhưng kiểm tra một thứ hoàn toàn khác.</div>\n\n<div class=\"groupTitle\">YES / NO / NOT GIVEN</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 8</span>Vậy Yes/No/NG khác T/F/NG ở đâu?</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Nếu T/F/NG kiểm tra sự kiện khách quan, thì Yes/No/Not Given kiểm tra <b>Ý KIẾN hoặc LẬP LUẬN của tác giả</b>. Khác biệt này quyết định toàn bộ cách em tiếp cận bài đọc.</p>\n    <table class=\"vt\">\n      <tr><th></th><th>True/False/NG</th><th>Yes/No/NG</th></tr>\n      <tr><td>Kiểm tra gì</td><td>SỰ KIỆN khách quan</td><td>Ý KIẾN/LẬP LUẬN của tác giả</td></tr>\n      <tr><td>Dấu hiệu bài đọc</td><td>Tường thuật, miêu tả, lịch sử</td><td>Tranh luận — \"the writer argues/believes\"</td></tr>\n      <tr><td>Not Given nghĩa là</td><td>Bài không nhắc đúng chi tiết đó</td><td>Tác giả không phát biểu rõ quan điểm đó</td></tr>\n    </table>\n    <p class=\"fixbox\">💡 Trước khi làm bất kỳ câu nào, hỏi mình: \"Đoạn này đang KỂ SỰ THẬT, hay đang THUYẾT PHỤC tôi tin vào một điều gì?\" — nếu là thuyết phục, chuyển ngay sang tư duy \"tác giả nghĩ gì\", không phải \"việc gì đã xảy ra\". Vẫn giữ nguyên quy trình 4 bước đã học ở T/F/NG — chỉ thay bước 3 (đối chiếu) từ \"đối chiếu sự kiện\" thành \"đối chiếu quan điểm\". Giờ hãy xem 5 kiểu bẫy cụ thể của dạng này.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 9</span>Phủ định quan điểm</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Giống hệt logic bẫy \"đối lập trực tiếp\" ở T/F/NG, nhưng áp dụng cho QUAN ĐIỂM thay vì sự kiện: câu hỏi khẳng định đúng điều mà tác giả đang PHẢN ĐỐI.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"It is essential...to use the polygraph.\"<br><b>Bài gốc:</b> \"...the polygraph <b>should be abandoned</b>...\"<br><b>Đáp án:</b> No</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 10</span>Gán sai nguyên nhân</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Câu hỏi gán cho một hiện tượng một nguyên nhân mà chính tác giả đã bác bỏ trong bài.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"People's body odour makes others stay away.\"<br><b>Bài gốc:</b> \"...<b>not</b> due to body odour...but rather to an invisible boundary.\"<br><b>Đáp án:</b> No</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 11</span>\"Chưa xác định\" bị đọc thành \"đã xác định\"</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Bài nói một nghiên cứu CHƯA đi đến kết luận, nhưng câu hỏi lại khẳng định như thể đã có kết luận rõ ràng.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Research has <b>shown</b>...\"<br><b>Bài gốc:</b> \"...research <b>has yet to determine</b> if...\"<br><b>Đáp án:</b> No</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 12</span>Đảo chiều một quá trình</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Bài mô tả một quá trình chỉ diễn ra theo MỘT chiều duy nhất, nhưng câu hỏi lại mô tả quá trình đó đi ngược chiều.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Memories can move <b>from long-term to short-term</b>.\"<br><b>Bài gốc:</b> chỉ mô tả chiều đi acquisition → short-term → long-term, không có chiều ngược lại.<br><b>Đáp án:</b> No</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 13</span>Cẩn thận: không phải mọi câu có chữ \"not\" đều là bẫy</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là trường hợp \"bẫy ngược\" — tác giả dùng phủ định MỘT PHẦN (\"not all\", \"not always\"), và câu hỏi diễn đạt lại gần như y hệt ý đó. Nhiều học sinh thấy chữ \"not\" liền tự động nghi ngờ và chọn No — đây mới chính là chỗ dễ sai.</p>\n    <div class=\"exbox\"><b>Câu hỏi:</b> \"Not all of the benefits...are guaranteed.\"<br><b>Bài gốc:</b> \"...advantages are <b>not always</b> assured.\"<br><b>Đáp án:</b> Yes — vì hai ý khớp nhau, đừng tự động nghi ngờ chỉ vì thấy chữ \"not\".</div>\n  </div></div>\n</div>\n\n<div class=\"groupTitle\">BẪY PARAPHRASE GIẢ — áp dụng cho CẢ HAI dạng</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bước 14</span>Trông giống nhưng nghĩa khác</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Toàn bộ các bẫy ở trên đều dựa trên việc đối chiếu Ý. Nhưng có một lớp bẫy nằm NGAY TRONG bước đối chiếu đó: hai cụm từ trông như một cặp đồng nghĩa (paraphrase thật), nhưng thực chất mang nghĩa khác nhau. Đây là lỗi hay gặp nhất ở những học sinh đã khá — vì các em đã quen \"thấy paraphrase là yên tâm\", nên dễ bỏ qua bước kiểm tra nghĩa kỹ càng.</p>\n    <div class=\"exbox\"><b>\"simultaneously\"</b> (cùng lúc) <b>≠</b> <b>\"worked together\"</b> (hợp tác) — hai việc xảy ra cùng thời điểm không có nghĩa là có sự hợp tác hay quan hệ nhân quả giữa chúng. → Not Given, không phải True.</div>\n    <div class=\"exbox\"><b>\"mentioned/related to\"</b> (được nhắc đến) <b>≠</b> <b>\"confirmed\"</b> (được xác nhận) — bài có nhắc đến một chủ đề không có nghĩa là bài đã xác nhận đúng chi tiết mà câu hỏi đang hỏi.</div>\n    <p class=\"fixbox\">💡 Ba cặp cần khắc ghi: \"cùng lúc\" không phải \"cùng nhau\"; \"liên quan đến\" không phải \"gây ra\"; \"được nhắc đến\" không phải \"được xác nhận\". Đây chính là cơ chế gốc đứng sau rất nhiều bẫy Not Given mà em vừa học ở trên.</p>\n  </div></div>\n</div>\n\n<div class=\"groupTitle\">NGÂN HÀNG PARAPHRASE TẦNG 1 — nền tảng để nhận ra các bẫy trên</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Tính từ</span>Nhóm dễ gây bẫy False nhất</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Toàn bộ quy trình đối chiếu ở trên chỉ hoạt động tốt nếu em nhận ra được khi nào hai từ khác nhau đang nói cùng một ý. Ba bảng dưới đây là điểm khởi đầu — không cần học thuộc ngay, chỉ cần NHẬN RA khi gặp lại.</p>\n    <table class=\"vt\">\n      <tr><th>Câu hỏi</th><th>Bài đọc</th><th>Nghĩa</th></tr>\n      <tr><td>abandoned</td><td>derelict</td><td>bị bỏ hoang</td></tr>\n      <tr><td>fat / fatter</td><td>skinny / plump / stout</td><td>béo / gầy</td></tr>\n      <tr><td>common / widespread</td><td>prevalent</td><td>phổ biến</td></tr>\n      <tr><td>declining / falling</td><td>dwindling / diminishing</td><td>suy giảm</td></tr>\n      <tr><td>dangerous</td><td>hazardous / perilous</td><td>nguy hiểm</td></tr>\n      <tr><td>huge / large</td><td>immense / substantial</td><td>to lớn, đáng kể</td></tr>\n      <tr><td>unique</td><td>distinct / distinctive</td><td>riêng biệt, đặc trưng</td></tr>\n    </table>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Động từ</span>Nhóm cốt lõi quyết định True/False</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <table class=\"vt\">\n      <tr><th>Câu hỏi</th><th>Bài đọc</th><th>Nghĩa</th></tr>\n      <tr><td>increase</td><td>rise / grow / surge / soar</td><td>tăng</td></tr>\n      <tr><td>decrease</td><td>decline / drop / plummet</td><td>giảm</td></tr>\n      <tr><td>cause</td><td>lead to / result in / trigger</td><td>gây ra, dẫn đến</td></tr>\n      <tr><td>be linked to</td><td>be connected/associated with</td><td>có liên quan đến</td></tr>\n      <tr><td>be abandoned</td><td>be given up / be abolished</td><td>bị từ bỏ, bãi bỏ</td></tr>\n      <tr><td>raise questions about</td><td>make...questionable</td><td>đặt nghi vấn về</td></tr>\n    </table>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Danh từ</span>Cụm danh từ hay gặp</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <table class=\"vt\">\n      <tr><th>Câu hỏi</th><th>Bài đọc</th><th>Nghĩa</th></tr>\n      <tr><td>threat</td><td>(major) problem</td><td>mối đe doạ, vấn đề nghiêm trọng</td></tr>\n      <tr><td>benefit / advantage</td><td>upside / merit</td><td>lợi ích</td></tr>\n      <tr><td>drawback</td><td>downside / disadvantage</td><td>hạn chế, nhược điểm</td></tr>\n      <tr><td>ability</td><td>capacity / capability</td><td>khả năng</td></tr>\n    </table>\n    <p class=\"fixbox\">💡 Chưa cần nhớ hết ngay — các từ này sẽ còn xuất hiện lặp lại ở những bài sau, mỗi lần gặp lại là một lần em quen thêm một chút.</p>\n  </div></div>\n</div>\n";
var QUIZ = [{"q": "Câu hỏi: \"Barn owls are fatter than true owls.\" Bài gốc nói: \"Barn owls are...skinnier than their characteristically fluffy and round counterparts.\" Đáp án đúng là gì?", "opts": ["True", "False", "Not Given"], "a": 1, "fb": ["Bài gốc nói NGƯỢC LẠI (skinnier = gầy hơn, không phải fatter = béo hơn).", "Đúng — đây là bẫy đối lập trực tiếp: một từ bị đổi ngược nghĩa.", "Bài CÓ nhắc rõ ràng, chỉ là nói ngược lại — không phải Not Given."]}, {"q": "Câu hỏi: \"A list of words is the most common item used...\" nhưng bài gốc chỉ nói đây là MỘT ví dụ (\"such as a list of words\"), không xếp hạng mức độ phổ biến. Đáp án đúng?", "opts": ["True", "False", "Not Given"], "a": 2, "fb": ["Bài không hề xác nhận đây là \"phổ biến nhất\" — không thể chọn True.", "Bài không nói ngược lại — không phải False.", "Đúng — bài chỉ nêu một ví dụ, không xếp hạng mức độ phổ biến. Đây là bẫy 'ví dụ → khẳng định tổng quát'."]}, {"q": "Câu hỏi: \"Rainfall is currently not possible on Mars.\" Bài gốc: \"Mars experienced rainfall several billion years ago.\" Đáp án đúng?", "opts": ["True", "False", "Not Given"], "a": 2, "fb": ["Bài không nói gì về HIỆN TẠI, chỉ nói về quá khứ xa xưa — không đủ dữ kiện để chọn True.", "Bài không phủ định rõ ràng điều này — không phải False.", "Đúng — bẫy sai thời điểm: bài nói về quá khứ, câu hỏi hỏi về hiện tại, không đủ dữ kiện."]}, {"q": "Đây là bài đọc kiểu tranh luận, có cụm \"the writer argues that...\". Dạng câu hỏi phù hợp nhất để kiểm tra ý trong bài này là gì?", "opts": ["True/False/Not Given", "Yes/No/Not Given", "Multiple Choice"], "a": 1, "fb": ["T/F/NG dùng cho bài tường thuật sự kiện khách quan, không phải bài tranh luận quan điểm.", "Đúng — bài có tính tranh luận, lập luận của tác giả → dùng Yes/No/Not Given.", "Multiple Choice không phải là dấu hiệu nhận biết của loại bài đọc này."]}, {"q": "Câu hỏi: \"It is essential to use the polygraph.\" Bài gốc: \"...the polygraph should be abandoned...\" Đáp án đúng (Yes/No/NG)?", "opts": ["Yes", "No", "Not Given"], "a": 1, "fb": ["Tác giả phản đối việc dùng polygraph — không thể là Yes.", "Đúng — tác giả cho rằng nên từ bỏ polygraph, ngược hẳn với \"essential to use\".", "Bài có nêu rõ quan điểm, không phải Not Given."]}, {"q": "Câu hỏi: \"Research has shown that...\" Bài gốc: \"...research has yet to determine if...\" Đáp án đúng?", "opts": ["Yes", "No", "Not Given"], "a": 1, "fb": ["Bài nói nghiên cứu CHƯA xác định được — không thể là Yes.", "Đúng — bẫy 'chưa xác định' bị đọc thành 'đã xác định'.", "Bài có nói rõ (chưa xác định), không phải Not Given."]}, {"q": "Câu hỏi: \"Not all of the benefits are guaranteed.\" Bài gốc: \"...advantages are not always assured.\" Đáp án đúng?", "opts": ["Yes", "No", "Not Given"], "a": 0, "fb": ["Đúng — hai câu cùng ý (phủ định một phần), không phải bẫy sai dù có chữ \"not\".", "Đây KHÔNG phải bẫy sai — ý hai câu khớp nhau hoàn toàn.", "Bài có nói rõ ý này — không phải Not Given."]}, {"q": "Hai nhà khoa học công bố phát minh \"simultaneously\" (cùng lúc). Câu hỏi khẳng định họ \"worked together\" (hợp tác với nhau). Đáp án đúng (T/F/NG)?", "opts": ["True", "False", "Not Given"], "a": 2, "fb": ["\"Cùng lúc\" không có nghĩa là \"hợp tác\" — không đủ dữ kiện để khẳng định.", "Bài không phủ định việc hợp tác, chỉ là không xác nhận — không phải False.", "Đúng — đây là bẫy paraphrase giả: 'simultaneously' ≠ 'worked together'."]}, {"q": "Bài chỉ \"mentioned\" (nhắc đến) một chủ đề, câu hỏi khẳng định chủ đề đó đã được \"confirmed\" (xác nhận cụ thể). Đáp án đúng?", "opts": ["True", "False", "Not Given"], "a": 2, "fb": ["Nhắc đến không có nghĩa là xác nhận chi tiết cụ thể — chưa đủ để chọn True.", "Bài không phủ định, chỉ là chưa xác nhận rõ — không phải False.", "Đúng — 'được nhắc đến' không phải là 'được xác nhận'. Đây là cơ chế gốc của phần lớn bẫy Not Given."]}, {"q": "Câu hỏi: \"Cotton became America's biggest industry.\" Bài gốc không hề xếp hạng ngành công nghiệp nào là lớn nhất. Đáp án đúng?", "opts": ["True", "False", "Not Given"], "a": 2, "fb": ["Bài không xác nhận \"biggest\" — không đủ để chọn True.", "Bài không phủ định điều này — không phải False.", "Đúng — bẫy từ giới hạn tuyệt đối: câu hỏi thêm từ \"biggest\" mà bài không hề xếp hạng."]}];

var answered = new Array(QUIZ.length).fill(false);
var firstChoice = new Array(QUIZ.length).fill(-1);

function enterLesson(){
  var v = $("nameInput").value.trim();
  if(!v){ $("nameInput").focus(); return; }
  studentName = v;
  $("gate").hidden = true;
  $("appRoot").hidden = false;
  $("tabs").hidden = false;
  renderRead();
}
$("enterBtn").addEventListener("click", enterLesson);
$("nameInput").addEventListener("keydown", function(e){ if(e.key === "Enter") enterLesson(); });

function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === name); });
  $("tab-read").hidden = name !== "read";
  $("tab-quiz").hidden = name !== "quiz";
  if(name === "quiz") renderQuiz();
}
$("tabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  switchTab(btn.dataset.tab);
});

var readRendered = false;
function renderRead(){
  if(readRendered) return;
  readRendered = true;
  var root = $("tab-read");
  root.innerHTML = READ_HTML;
  root.querySelectorAll(".acc-h").forEach(function(h){
    h.addEventListener("click", function(){
      h.closest(".acc").classList.toggle("open");
    });
  });
}

var quizRendered = false;
function renderQuiz(){
  if(quizRendered) return;
  quizRendered = true;
  var root = $("tab-quiz");
  var html = '<div class="card"><p style="color:var(--fg-dim)">Đọc kỹ rồi chọn đáp án. Lần chọn ĐẦU TIÊN được tính điểm — vẫn có thể chọn lại để xem giải thích và học thêm.</p></div>';
  QUIZ.forEach(function(item, i){
    html += '<div class="card qcard" data-qi="' + i + '">';
    html += '<div class="qtext">Câu ' + (i+1) + '. ' + item.q + '</div>';
    item.opts.forEach(function(opt, oi){
      html += '<label class="opt" data-oi="' + oi + '"><input type="radio" name="q' + i + '" value="' + oi + '"><span>' + opt + '</span></label>';
    });
    html += '<div class="fb" data-fb></div></div>';
  });
  html += '<div class="card" id="submitCard"><button class="primary" id="submitBtn" disabled>Nộp bài (0/' + QUIZ.length + ')</button></div>';
  root.innerHTML = html;

  root.querySelectorAll(".qcard").forEach(function(card){
    var qi = parseInt(card.dataset.qi, 10);
    card.querySelectorAll(".opt").forEach(function(label){
      label.addEventListener("click", function(){
        var oi = parseInt(label.dataset.oi, 10);
        if(!answered[qi]){ answered[qi] = true; firstChoice[qi] = oi; }
        label.querySelector("input").checked = true;
        var correctIdx = QUIZ[qi].a;
        card.querySelectorAll(".opt").forEach(function(l, li){
          l.classList.remove("correct","wrong");
          if(li === correctIdx) l.classList.add("correct");
          else if(li === oi) l.classList.add("wrong");
        });
        var fb = card.querySelector("[data-fb]");
        fb.textContent = QUIZ[qi].fb[oi];
        fb.className = "fb show " + (oi === correctIdx ? "good" : "bad");
        updateSubmitBtn();
      });
    });
  });
  updateSubmitBtn();
}

function updateSubmitBtn(){
  var done = answered.filter(Boolean).length;
  var btn = $("submitBtn");
  if(!btn) return;
  btn.textContent = "Nộp bài (" + done + "/" + QUIZ.length + ")";
  btn.disabled = done < QUIZ.length;
}

document.addEventListener("click", function(e){
  if(e.target && e.target.id === "submitBtn") submitQuiz();
});

function score(){
  var correct = 0;
  for(var i=0;i<QUIZ.length;i++){ if(firstChoice[i] === QUIZ[i].a) correct++; }
  return {correct: correct, total: QUIZ.length, pct: Math.round(correct/QUIZ.length*100)};
}

var SCRIPT_URL = "PASTE_SCRIPT_URL_HERE";

async function submitQuiz(){
  var s = score();
  var root = $("tab-quiz");
  var payload = { name: studentName, lesson: LESSON_ID, correct: s.correct, total: s.total, pct: s.pct, answers: firstChoice, submittedAt: new Date().toISOString() };
  var savedMsg = "";
  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    savedMsg = "Đã gửi kết quả cho giáo viên.";
  } catch(err){
    savedMsg = "Không gửi được tự động — em chụp màn hình kết quả gửi qua Zalo cho cô nhé.";
  }
  root.innerHTML = '<div class="card scorebox">'
    + '<div style="color:var(--fg-dim)">Kết quả của ' + escapeHtml(studentName) + '</div>'
    + '<div class="num">' + s.correct + '/' + s.total + '</div>'
    + '<div style="color:var(--fg-dim); margin-bottom:10px">(' + s.pct + '%)</div>'
    + '<p>' + (s.pct >= 75 ? 'Rất tốt! Em đã nắm chắc phần này. 🎉' : 'Em nên đọc lại tab "Đào sâu" một lần nữa trước khi làm đề thật nhé.') + '</p>'
    + '<p class="note">' + savedMsg + '</p>'
    + '</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
})();
</script>
