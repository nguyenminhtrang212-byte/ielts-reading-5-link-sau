<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Họ Nối Chuyên Sâu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme: light; }
  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#edeadf; --fg:#262319; --fg-dim:#696152;
    --accent:#2a7a7a; --accent-fg:#ffffff; --accent-soft:#d6ebea;
    --ok:#2f7a4f; --ok-soft:#dcefe0; --bad:#b4302f; --bad-soft:#f6dcda;
    --border:#ddd6c3; --shadow:0 1px 2px rgba(30,30,10,.06), 0 8px 24px rgba(30,30,10,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
      --accent:#7fd4d4; --accent-fg:#0b2525; --accent-soft:#1f3a3a;
      --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
      --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
    --accent:#7fd4d4; --accent-fg:#0b2525; --accent-soft:#1f3a3a;
    --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
    --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; margin:0; padding-inline:16px; padding-block:24px; line-height:1.55}
  h1,h2,h3{font-family:Fraunces,Georgia,serif; font-weight:600; text-wrap:balance; margin:0 0 .4em}
  .wrap{max-width:760px; margin:0 auto}
  p{margin:.5em 0}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px}
  [hidden]{display:none!important}

  #gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
  #gate .box{max-width:380px; width:100%; text-align:center}
  #gate input{width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg); margin:14px 0}
  #gate button{width:100%; font-size:16px; font-weight:600; padding:12px 14px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  #gate .emoji{font-size:40px}

  nav.tabs{display:flex; gap:8px; max-width:760px; margin:0 auto 16px; overflow-x:auto}
  nav.tabs button{flex:1; white-space:nowrap; font:inherit; font-weight:600; font-size:14px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg-dim); cursor:pointer}
  nav.tabs button.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}

  .lede{color:var(--fg-dim); font-style:italic; border-left:3px solid var(--accent); padding-left:12px; margin:0 0 20px}
  .groupTitle{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-dim); margin:22px 0 10px; display:flex; align-items:center; gap:8px}
  .groupTitle::after{content:""; flex:1; height:1px; background:var(--border)}

  .acc{border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface)}
  .acc-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; cursor:pointer; font-weight:600}
  .acc-h .tag{font-size:.75rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; margin-right:8px}
  .acc-h .chev{transition:transform .2s; color:var(--fg-dim); flex:0 0 auto}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease}
  .acc.open .acc-body{max-height:4000px}
  .acc-inner{padding:0 16px 16px}
  .acc-inner h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-dim); margin:12px 0 6px}
  .acc-inner ul{margin:0; padding-left:18px}
  .acc-inner li{margin-bottom:8px}
  .fixbox{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin-top:6px; font-size:.94rem}
  .exbox{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:8px; padding:8px 12px; margin:6px 0; font-size:.92rem}
  .exbox b{color:var(--accent)}
  table.vt{width:100%; border-collapse:collapse; font-size:.88rem; margin:8px 0}
  table.vt th, table.vt td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border)}
  table.vt th{color:var(--fg-dim); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em}
  .note-card{background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:.95rem}

  .qcard{margin-bottom:14px}
  .qcard .qtext{font-weight:600; margin-bottom:10px}
  .opt{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:3px}
  .opt.correct{background:var(--ok-soft); border-color:var(--ok)}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .fb{display:none; margin-top:8px; padding:10px 12px; border-radius:10px; font-size:.92rem}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft); color:var(--ok)}
  .fb.bad{background:var(--bad-soft); color:var(--bad)}
  button.primary{font:inherit; font-weight:600; font-size:15px; padding:12px 18px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  button.primary:disabled{opacity:.5; cursor:not-allowed}
  .scorebox{text-align:center; padding:24px 16px}
  .scorebox .num{font-family:Fraunces,serif; font-size:2.6rem; color:var(--accent)}
  .note{color:var(--fg-dim); font-size:.85rem; margin-top:10px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="emoji">🔗</div>
    <h1 style="font-size:1.4rem">Họ Nối Chuyên Sâu</h1>
    <p style="color:var(--fg-dim)">Nhập tên của em để bắt đầu nhé.</p>
    <input id="nameInput" placeholder="Tên của em" autocomplete="off">
    <button id="enterBtn">Bắt đầu</button>
  </div>
</div>

<div class="wrap" id="appRoot" hidden>
  <h1 style="font-size:1.5rem">Họ Nối Chuyên Sâu</h1>
  <p class="lede">3 dạng cùng họ "nối": Matching Headings, Matching Information, Matching Features — mỗi dạng nối với một đối tượng khác nhau (tiêu đề / đoạn văn / tên người), bẫy đặc trưng riêng cho từng dạng.</p>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="read" class="active">📖 Đào sâu</button>
  <button data-tab="quiz">🎯 Luyện nhận diện</button>
</nav>

<div class="wrap">
<section id="tab-read"></section>
<section id="tab-quiz" hidden></section>
</div>

<script>
(function(){
"use strict";
var LESSON_ID = "sau-ho-noi";
var studentName = "";
function $(id){ return document.getElementById(id); }

var READ_HTML = "\n<div class=\"note-card\"><b>Cách học trang này:</b> ba dạng dưới đây đều là \"nối một thứ với một lựa chọn trong danh sách cho sẵn\" — nhưng mỗi dạng nối với một ĐỐI TƯỢNG khác hẳn nhau (tiêu đề / đoạn văn chứa chi tiết / tên người), nên bẫy đặc trưng của từng dạng cũng khác nhau hoàn toàn. Ta học lần lượt từng dạng theo đúng thứ tự, đừng áp dụng chung một cách làm cho cả ba.</div>\n\n<div class=\"groupTitle\">MATCHING HEADINGS</div>\n\n<div class=\"acc open\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Cách ra đề</span>Nối đoạn văn ↔ tiêu đề</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là dạng phổ biến nhất trong họ Nối, xuất hiện ở hầu hết đề thi thật: nối từng đoạn văn (A, B, C...) với đúng tiêu đề trong danh sách cho sẵn. Một đặc điểm CỐ ĐỊNH của dạng này: số tiêu đề LUÔN nhiều hơn số đoạn — tức luôn có ít nhất một tiêu đề \"mồi\" không dùng đến. Đây không phải lỗi đề thi, mà là quy tắc ra đề chuẩn, nên đừng cố dùng hết toàn bộ tiêu đề trong danh sách.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 1</span>Số tiêu đề nhiều hơn số đoạn</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">Bài \"Optimism Bias\": 6 tiêu đề cho chỉ 3 đoạn văn — luôn có tiêu đề \"mồi\" nghe rất hợp lý nhưng không khớp đoạn nào cả.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 2</span>Đoạn không có câu chủ đề rõ</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Học sinh quen thói quen chỉ đọc câu đầu đoạn để đoán ý chính — thói quen này thất bại ngay khi gặp đoạn không có câu chủ đề rõ ràng ở đầu.</p>\n    <div class=\"exbox\">Đoạn A của bài \"băng dính y tế\" và đoạn A của bài \"Optimism Bias\" đều KHÔNG có câu chủ đề rõ — phải đọc toàn đoạn mới nắm được đúng ý chính.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 3</span>Tiêu đề quá hẹp</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Tiêu đề mồi dạng này chỉ đúng với MỘT chi tiết nhỏ bên trong đoạn, chứ không bao quát được ý của cả đoạn — dễ \"dính bẫy\" nếu chỉ đọc lướt và thấy từ khoá trùng khớp.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 4</span>Tiêu đề quá rộng / dùng chung từ khoá</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Ngược với bẫy 3: nhiều tiêu đề trong danh sách cùng chia sẻ một từ khoá chủ đề, nhưng mỗi tiêu đề lại nói về một PHẠM VI khác nhau của chủ đề đó.</p>\n    <div class=\"exbox\">\"effect on business\" so với \"genetic basis\" so với \"personality relates to\" — cả ba đều nói về optimism bias, nhưng ở ba phạm vi hoàn toàn khác nhau.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 5 — tinh vi nhất của dạng này</span>Paraphrase ở mức Ý TƯỞNG</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là mức paraphrase khó nhất mà em sẽ gặp trong cả 10 dạng đề: tiêu đề không chỉ đổi một vài từ đồng nghĩa đơn giản, mà DIỄN ĐẠT LẠI TOÀN BỘ KHÁI NIỆM bằng cách nói khác hẳn.</p>\n    <div class=\"exbox\">\"can make them vulnerable to invasive species\" (trong bài) → phải tự suy luận ra tiêu đề đúng là: <b>\"The risk of not having evolutionary defence mechanisms\"</b> — không hề có từ nào trùng nhau, chỉ trùng Ý.</div>\n    <p class=\"fixbox\">💡 Nguyên tắc sống còn cho Matching Headings: luôn đọc TRỌN cả đoạn trước khi chọn (không chỉ câu đầu). Tự tóm ý chính bằng 3-5 từ CỦA RIÊNG MÌNH trước khi nhìn vào danh sách tiêu đề — làm vậy giúp em không bị \"dụ\" bởi một tiêu đề nghe hay nhưng sai phạm vi.</p>\n  </div></div>\n</div>\n\n<div class=\"note-card\">Tới đây em đã nắm được cả 5 bẫy của Matching Headings. Bây giờ chuyển sang dạng thứ hai — Matching Information — nối với một đối tượng hoàn toàn khác: không phải tiêu đề, mà là một CHI TIẾT cụ thể.</div>\n\n<div class=\"groupTitle\">MATCHING INFORMATION</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Cách ra đề</span>Nối chi tiết ↔ đoạn văn</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Khác hẳn Matching Headings (nối Ý CHÍNH của cả đoạn), dạng này yêu cầu em xác định một CHI TIẾT cụ thể (một ví dụ, số liệu, mốc thời gian, lý do...) nằm ở đoạn nào (A, B, C...). Một điểm khác biệt quan trọng cần nhớ: đề luôn ghi chú \"NB: You may use any letter more than once\" — nghĩa là MỘT đoạn có thể là đáp án cho NHIỀU câu hỏi khác nhau.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 1</span>Từ khoá luôn bị paraphrase</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">\"country publishing laws in multiple languages\" (câu hỏi) ↔ \"announces all national laws in German, French, and Italian\" (bài) — câu hỏi diễn đạt lại bằng một ý tổng quát hơn hẳn.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 2</span>Đoạn \"gần đúng chủ đề\" nhưng sai Ý</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Có những đoạn nhắc đến cùng một chủ đề với câu hỏi, nhưng khi đọc kỹ lại không khớp đúng Ý câu hỏi đang hỏi — cần đọc kỹ cả câu để xác nhận ý, không chỉ khớp từ bề mặt.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 3</span>Mặc định (sai) rằng mỗi đoạn chỉ dùng 1 lần</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Nối lại với điểm khác biệt đã nêu ở phần \"cách ra đề\": nhiều học sinh quên mất đề cho phép dùng lại một chữ cái nhiều lần, nên tự loại một đoạn chỉ vì \"đã dùng nó cho câu trước\".</p>\n    <div class=\"exbox\">Hai câu hỏi hoàn toàn khác nhau vẫn có thể cùng trỏ về một đoạn duy nhất.</div>\n    <p class=\"fixbox\">💡 Xác định từ khoá của TỪNG câu hỏi một cách độc lập, không đọc gộp nhiều câu. Đừng tự loại một đoạn chỉ vì nó \"đã được dùng\".</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 4</span>Nhầm người nói (biến thể match-with-person)</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Một biến thể khác của dạng này: nhiều nhân vật trong bài phát biểu những ý tương tự nhau, và em cần phân biệt chính xác ai nói gì.</p>\n    <div class=\"exbox\">Bài về drone nông nghiệp: cần phân biệt đúng câu nói của từng chuyên gia được phỏng vấn trong bài.</div>\n  </div></div>\n</div>\n\n<div class=\"note-card\">Vậy là em đã nắm cả Matching Headings (nối Ý CHÍNH) và Matching Information (nối CHI TIẾT). Dạng thứ ba — Matching Features — nối với một đối tượng khác hẳn hai dạng trên: TÊN RIÊNG của người hoặc tổ chức.</div>\n\n<div class=\"groupTitle\">MATCHING FEATURES</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Cách ra đề</span>Nối đặc điểm ↔ tên người/tổ chức</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Dạng này yêu cầu nối một câu/đặc điểm với đúng người hoặc tổ chức trong danh sách cho sẵn (toàn tên riêng). Số lượng đối tượng trong danh sách có thể không bằng số câu hỏi — có thể dư đối tượng, hoặc một đối tượng được dùng cho nhiều câu.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 1 — đặc trưng và nguy hiểm nhất của dạng này</span>2-3 đối tượng có đặc điểm gần giống nhau</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là bẫy khó nhất của Matching Features: nhiều người hoặc tổ chức cùng xuất hiện trong một đoạn, với những đặc điểm na ná nhau — khiến em rất dễ gán nhầm đặc điểm cho sai người.</p>\n    <div class=\"exbox\">3 bảo tàng ở Canada đều được mô tả là \"ấn tượng\"; 3 người cùng làm công việc liên quan đến \"máy bay/thư tín\" trong cùng một đoạn.</div>\n    <p class=\"fixbox\">💡 Ngay khi phát hiện nhiều đối tượng có đặc điểm tương tự, hãy lập một bảng nháp nhỏ \"tên — đặc điểm\" khi đọc, thay vì cố nhớ hết trong đầu — đây là cách khắc phục hiệu quả nhất cho bẫy này.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 2</span>Một đối tượng được nhắc nhiều lần</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">Một nhà nghiên cứu xuất hiện ở cả câu 1 và câu 5 của cùng một bài, nhưng với hai ý hoàn toàn khác nhau.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 3</span>Đối tượng \"mồi\" không khớp câu nào</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">Bài \"Gender and Linguistics\": danh sách có 5 người nhưng chỉ 4 câu hỏi khớp — một người là \"mồi\".</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 4</span>Paraphrase ở mức CẢ CÂU/Ý</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Khác với Summary Completion (chỉ đổi 1-2 từ), ở đây em phải hiểu và diễn giải lại NGUYÊN CẢ CÂU mới nhận ra sự trùng khớp.</p>\n    <div class=\"exbox\">\"dual process involving...intelligence but also knowledge\" → được diễn đạt lại thành <b>\"a two-part process\"</b>.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 5 &amp; 6</span>\"not only...but also\" &amp; thứ tự KHÔNG theo bài</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Hai điểm cuối cùng cần nhớ: cấu trúc \"not only...but also\" gộp 2 ý trong một câu, dễ khiến em gán sai đặc điểm cho sai người nếu không phân tích kỹ cấu trúc. Và khác với Matching Information (luôn đi theo thứ tự bài), câu hỏi của Matching Features KHÔNG đi theo thứ tự xuất hiện trong bài — đây là điểm khác biệt quan trọng, tránh áp dụng nhầm chiến thuật giữa hai dạng.</p>\n  </div></div>\n</div>\n";
var QUIZ = [{"q": "Bài \"Optimism Bias\" có 6 tiêu đề cho chỉ 3 đoạn văn. Điều này có nghĩa là gì khi làm bài?", "opts": ["Luôn có tiêu đề thừa, không khớp đoạn nào — là chuyện bình thường của dạng này", "Đề bị in sai", "Phải dùng hết cả 6 tiêu đề", "Chỉ cần đoán ngẫu nhiên vì tiêu đề nào cũng có thể đúng"], "a": 0, "fb": ["Đúng — Matching Headings LUÔN có tiêu đề nhiều hơn số đoạn, đây là đặc điểm cố định của dạng đề, không phải lỗi.", "Đây là cách ra đề chuẩn của dạng này, không phải lỗi in ấn.", "Chỉ dùng đúng số tiêu đề = số đoạn, các tiêu đề còn lại là \"mồi\".", "Luôn có 1 đáp án đúng nhất cho mỗi đoạn, không nên đoán ngẫu nhiên."]}, {"q": "Đoạn văn không có câu chủ đề rõ ràng ở đầu đoạn. Cách làm đúng để chọn tiêu đề là gì?", "opts": ["Chỉ đọc câu đầu rồi chọn ngay", "Đọc trọn cả đoạn, tự tóm ý chính bằng từ của mình trước khi nhìn tiêu đề", "Chọn tiêu đề dài nhất", "Bỏ qua đoạn đó"], "a": 1, "fb": ["Cách này dễ bỏ sót ý chính thật nằm giữa hoặc cuối đoạn.", "Đúng — đọc trọn đoạn và tự tóm ý trước giúp tránh bị \"dụ\" bởi tiêu đề nghe hay nhưng sai phạm vi.", "Độ dài tiêu đề không liên quan tới việc đúng/sai.", "Vẫn cần làm hết các đoạn trong bài."]}, {"q": "Câu hỏi Matching Information: \"country publishing laws in multiple languages\". Bài viết: \"announces all national laws in German, French, and Italian.\" Đây là cơ chế bẫy nào?", "opts": ["Từ khoá bị paraphrase", "Nhầm người nói", "Đối tượng mồi", "Vượt giới hạn số từ"], "a": 0, "fb": ["Đúng — \"publishing laws in multiple languages\" được diễn đạt lại thành liệt kê cụ thể 3 ngôn ngữ.", "Không liên quan tới nhân vật phát biểu.", "Không liên quan tới Matching Features.", "Đây không phải dạng điền từ có giới hạn."]}, {"q": "Trong Matching Information, một đoạn văn đã được dùng làm đáp án cho câu 2. Đoạn đó có thể là đáp án cho câu 5 không?", "opts": ["Không, mỗi đoạn chỉ dùng 1 lần", "Có — đề luôn cho phép dùng lại 1 chữ cái nhiều lần (trừ khi đề nói khác)"], "a": 1, "fb": ["Đây là hiểu lầm phổ biến — đề luôn ghi chú rõ việc này.", "Đúng — đừng tự loại một đoạn chỉ vì đã dùng nó cho câu trước."]}, {"q": "Trong một bài Matching Features, có 3 bảo tàng ở Canada đều được mô tả là \"ấn tượng\" trong cùng một đoạn văn. Đây là bẫy đặc trưng nào?", "opts": ["2-3 đối tượng có đặc điểm gần giống nhau", "Đối tượng mồi không khớp câu nào", "Paraphrase ở mức cả câu", "Not only...but also"], "a": 0, "fb": ["Đúng — đây chính là bẫy đặc trưng và nguy hiểm nhất của Matching Features.", "Đây là tình huống khác: có đối tượng không khớp câu nào, không phải nhầm lẫn giữa các đối tượng giống nhau.", "Không liên quan tới cách diễn đạt câu.", "Không liên quan tới cấu trúc ngữ pháp này."]}, {"q": "Khi gặp nhiều người/tổ chức có đặc điểm tương tự trong Matching Features, cách khắc phục tốt nhất là gì?", "opts": ["Cố nhớ hết trong đầu", "Lập bảng nháp nhỏ \"tên — đặc điểm\" ngay khi đọc", "Chọn đại một người bất kỳ", "Bỏ qua các câu khó, làm câu dễ trước"], "a": 1, "fb": ["Cố nhớ trong đầu dễ gây nhầm lẫn khi có nhiều đối tượng giống nhau.", "Đúng — ghi chú nhanh giúp tránh nhầm lẫn giữa các đối tượng có đặc điểm na ná.", "Đoán ngẫu nhiên không phải chiến thuật tốt.", "Chiến thuật này không giải quyết được vấn đề nhầm lẫn đối tượng giống nhau."]}, {"q": "Khác với Matching Information, thứ tự câu hỏi của Matching Features có đi theo thứ tự xuất hiện trong bài không?", "opts": ["Có, luôn theo thứ tự", "Không — câu hỏi KHÔNG đi theo thứ tự xuất hiện trong bài"], "a": 1, "fb": ["Đây là điểm khác biệt quan trọng — Matching Information mới đi theo thứ tự, còn Matching Features thì không.", "Đúng — đây là điểm khác biệt quan trọng cần nhớ giữa hai dạng, tránh áp dụng sai chiến thuật."]}, {"q": "Tiêu đề trong Matching Headings diễn đạt lại thành \"The risk of not having evolutionary defence mechanisms\" cho ý bài \"can make them vulnerable to invasive species\". Đây là mức paraphrase nào?", "opts": ["Chỉ đổi 1 từ đồng nghĩa đơn giản", "Paraphrase ở mức Ý TƯỞNG — diễn đạt lại cả khái niệm", "Không phải paraphrase, là nguyên văn", "Đây là lỗi đề thi"], "a": 1, "fb": ["Mức độ paraphrase ở đây sâu hơn nhiều so với đổi 1 từ đơn giản.", "Đúng — đây là mức paraphrase khó nhất của Matching Headings, cần suy luận khái niệm chứ không chỉ tìm từ đồng nghĩa.", "Hai câu không hề giống nhau về mặt từ ngữ.", "Đây là cách ra đề bình thường ở mức khó của dạng này."]}];

var answered = new Array(QUIZ.length).fill(false);
var firstChoice = new Array(QUIZ.length).fill(-1);

function enterLesson(){
  var v = $("nameInput").value.trim();
  if(!v){ $("nameInput").focus(); return; }
  studentName = v;
  $("gate").hidden = true;
  $("appRoot").hidden = false;
  $("tabs").hidden = false;
  renderRead();
}
$("enterBtn").addEventListener("click", enterLesson);
$("nameInput").addEventListener("keydown", function(e){ if(e.key === "Enter") enterLesson(); });

function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === name); });
  $("tab-read").hidden = name !== "read";
  $("tab-quiz").hidden = name !== "quiz";
  if(name === "quiz") renderQuiz();
}
$("tabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  switchTab(btn.dataset.tab);
});

var readRendered = false;
function renderRead(){
  if(readRendered) return;
  readRendered = true;
  var root = $("tab-read");
  root.innerHTML = READ_HTML;
  root.querySelectorAll(".acc-h").forEach(function(h){
    h.addEventListener("click", function(){
      h.closest(".acc").classList.toggle("open");
    });
  });
}

var quizRendered = false;
function renderQuiz(){
  if(quizRendered) return;
  quizRendered = true;
  var root = $("tab-quiz");
  var html = '<div class="card"><p style="color:var(--fg-dim)">Đọc kỹ rồi chọn đáp án. Lần chọn ĐẦU TIÊN được tính điểm — vẫn có thể chọn lại để xem giải thích và học thêm.</p></div>';
  QUIZ.forEach(function(item, i){
    html += '<div class="card qcard" data-qi="' + i + '">';
    html += '<div class="qtext">Câu ' + (i+1) + '. ' + item.q + '</div>';
    item.opts.forEach(function(opt, oi){
      html += '<label class="opt" data-oi="' + oi + '"><input type="radio" name="q' + i + '" value="' + oi + '"><span>' + opt + '</span></label>';
    });
    html += '<div class="fb" data-fb></div></div>';
  });
  html += '<div class="card" id="submitCard"><button class="primary" id="submitBtn" disabled>Nộp bài (0/' + QUIZ.length + ')</button></div>';
  root.innerHTML = html;

  root.querySelectorAll(".qcard").forEach(function(card){
    var qi = parseInt(card.dataset.qi, 10);
    card.querySelectorAll(".opt").forEach(function(label){
      label.addEventListener("click", function(){
        var oi = parseInt(label.dataset.oi, 10);
        if(!answered[qi]){ answered[qi] = true; firstChoice[qi] = oi; }
        label.querySelector("input").checked = true;
        var correctIdx = QUIZ[qi].a;
        card.querySelectorAll(".opt").forEach(function(l, li){
          l.classList.remove("correct","wrong");
          if(li === correctIdx) l.classList.add("correct");
          else if(li === oi) l.classList.add("wrong");
        });
        var fb = card.querySelector("[data-fb]");
        fb.textContent = QUIZ[qi].fb[oi];
        fb.className = "fb show " + (oi === correctIdx ? "good" : "bad");
        updateSubmitBtn();
      });
    });
  });
  updateSubmitBtn();
}

function updateSubmitBtn(){
  var done = answered.filter(Boolean).length;
  var btn = $("submitBtn");
  if(!btn) return;
  btn.textContent = "Nộp bài (" + done + "/" + QUIZ.length + ")";
  btn.disabled = done < QUIZ.length;
}

document.addEventListener("click", function(e){
  if(e.target && e.target.id === "submitBtn") submitQuiz();
});

function score(){
  var correct = 0;
  for(var i=0;i<QUIZ.length;i++){ if(firstChoice[i] === QUIZ[i].a) correct++; }
  return {correct: correct, total: QUIZ.length, pct: Math.round(correct/QUIZ.length*100)};
}

var SCRIPT_URL = "PASTE_SCRIPT_URL_HERE";

async function submitQuiz(){
  var s = score();
  var root = $("tab-quiz");
  var payload = { name: studentName, lesson: LESSON_ID, correct: s.correct, total: s.total, pct: s.pct, answers: firstChoice, submittedAt: new Date().toISOString() };
  var savedMsg = "";
  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    savedMsg = "Đã gửi kết quả cho giáo viên.";
  } catch(err){
    savedMsg = "Không gửi được tự động — em chụp màn hình kết quả gửi qua Zalo cho cô nhé.";
  }
  root.innerHTML = '<div class="card scorebox">'
    + '<div style="color:var(--fg-dim)">Kết quả của ' + escapeHtml(studentName) + '</div>'
    + '<div class="num">' + s.correct + '/' + s.total + '</div>'
    + '<div style="color:var(--fg-dim); margin-bottom:10px">(' + s.pct + '%)</div>'
    + '<p>' + (s.pct >= 75 ? 'Rất tốt! Em đã nắm chắc phần này. 🎉' : 'Em nên đọc lại tab "Đào sâu" một lần nữa trước khi làm đề thật nhé.') + '</p>'
    + '<p class="note">' + savedMsg + '</p>'
    + '</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
})();
</script>
</body>
</html>
