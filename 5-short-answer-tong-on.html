<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trả Lời Ngắn & Tổng Ôn Thực Chiến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme: light; }
  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#edeadf; --fg:#262319; --fg-dim:#696152;
    --accent:#9a6a1f; --accent-fg:#ffffff; --accent-soft:#f2e2c4;
    --ok:#2f7a4f; --ok-soft:#dcefe0; --bad:#b4302f; --bad-soft:#f6dcda;
    --border:#ddd6c3; --shadow:0 1px 2px rgba(30,30,10,.06), 0 8px 24px rgba(30,30,10,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
      --accent:#e8c17f; --accent-fg:#2a1d08; --accent-soft:#453523;
      --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
      --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17190f; --surface:#212418; --surface-2:#2a2e1f; --fg:#eeeee0; --fg-dim:#b1ad99;
    --accent:#e8c17f; --accent-fg:#2a1d08; --accent-soft:#453523;
    --ok:#7fcf9b; --ok-soft:#1f3327; --bad:#f09090; --bad-soft:#3a2321;
    --border:#383a2c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--fg); font-family:Inter,system-ui,sans-serif; margin:0; padding-inline:16px; padding-block:24px; line-height:1.55}
  h1,h2,h3{font-family:Fraunces,Georgia,serif; font-weight:600; text-wrap:balance; margin:0 0 .4em}
  .wrap{max-width:760px; margin:0 auto}
  p{margin:.5em 0}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px}
  [hidden]{display:none!important}

  #gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
  #gate .box{max-width:380px; width:100%; text-align:center}
  #gate input{width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg); margin:14px 0}
  #gate button{width:100%; font-size:16px; font-weight:600; padding:12px 14px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  #gate .emoji{font-size:40px}

  nav.tabs{display:flex; gap:8px; max-width:760px; margin:0 auto 16px; overflow-x:auto}
  nav.tabs button{flex:1; white-space:nowrap; font:inherit; font-weight:600; font-size:14px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--fg-dim); cursor:pointer}
  nav.tabs button.active{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}

  .lede{color:var(--fg-dim); font-style:italic; border-left:3px solid var(--accent); padding-left:12px; margin:0 0 20px}
  .groupTitle{font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--fg-dim); margin:22px 0 10px; display:flex; align-items:center; gap:8px}
  .groupTitle::after{content:""; flex:1; height:1px; background:var(--border)}

  .acc{border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface)}
  .acc-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; cursor:pointer; font-weight:600}
  .acc-h .tag{font-size:.75rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; margin-right:8px}
  .acc-h .chev{transition:transform .2s; color:var(--fg-dim); flex:0 0 auto}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-body{max-height:0; overflow:hidden; transition:max-height .3s ease}
  .acc.open .acc-body{max-height:4000px}
  .acc-inner{padding:0 16px 16px}
  .acc-inner h4{font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-dim); margin:12px 0 6px}
  .acc-inner ul{margin:0; padding-left:18px}
  .acc-inner li{margin-bottom:8px}
  .fixbox{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin-top:6px; font-size:.94rem}
  .exbox{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:8px; padding:8px 12px; margin:6px 0; font-size:.92rem}
  .exbox b{color:var(--accent)}
  table.vt{width:100%; border-collapse:collapse; font-size:.88rem; margin:8px 0}
  table.vt th, table.vt td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--border)}
  table.vt th{color:var(--fg-dim); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em}
  .note-card{background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:.95rem}

  .qcard{margin-bottom:14px}
  .qcard .qtext{font-weight:600; margin-bottom:10px}
  .opt{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin-top:3px}
  .opt.correct{background:var(--ok-soft); border-color:var(--ok)}
  .opt.wrong{background:var(--bad-soft); border-color:var(--bad)}
  .fb{display:none; margin-top:8px; padding:10px 12px; border-radius:10px; font-size:.92rem}
  .fb.show{display:block}
  .fb.good{background:var(--ok-soft); color:var(--ok)}
  .fb.bad{background:var(--bad-soft); color:var(--bad)}
  button.primary{font:inherit; font-weight:600; font-size:15px; padding:12px 18px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  button.primary:disabled{opacity:.5; cursor:not-allowed}
  .scorebox{text-align:center; padding:24px 16px}
  .scorebox .num{font-family:Fraunces,serif; font-size:2.6rem; color:var(--accent)}
  .note{color:var(--fg-dim); font-size:.85rem; margin-top:10px}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="emoji">🏁</div>
    <h1 style="font-size:1.4rem">Trả Lời Ngắn & Tổng Ôn Thực Chiến</h1>
    <p style="color:var(--fg-dim)">Nhập tên của em để bắt đầu nhé.</p>
    <input id="nameInput" placeholder="Tên của em" autocomplete="off">
    <button id="enterBtn">Bắt đầu</button>
  </div>
</div>

<div class="wrap" id="appRoot" hidden>
  <h1 style="font-size:1.5rem">Trả Lời Ngắn & Tổng Ôn Thực Chiến</h1>
  <p class="lede">Dạng cuối cùng — Short Answer Questions — và bài tổng ôn trộn cả 10 dạng đề, chặng cuối trước khi em bước vào làm đề thật.</p>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="read" class="active">📖 Đào sâu</button>
  <button data-tab="quiz">🎯 Luyện nhận diện</button>
</nav>

<div class="wrap">
<section id="tab-read"></section>
<section id="tab-quiz" hidden></section>
</div>

<script>
(function(){
"use strict";
var LESSON_ID = "sau-short-answer-tong-on";
var studentName = "";
function $(id){ return document.getElementById(id); }

var READ_HTML = "\n<div class=\"groupTitle\">SHORT ANSWER QUESTIONS</div>\n\n<div class=\"acc open\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Cách ra đề</span>Dạng DUY NHẤT bắt buộc trích nguyên văn</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây là dạng đề cuối cùng trong hành trình 10 dạng, và cũng là dạng có một quy tắc KHÁC HẲN mọi dạng em đã học: câu hỏi dùng từ nghi vấn (What/Which/How/Who...), và đáp án phải là từ/cụm trích <b>ĐÚNG NGUYÊN VĂN</b> từ bài — không được tự diễn đạt lại dù đúng ý, kèm giới hạn số từ nghiêm ngặt như họ Điền Từ. Dạng này không xuất hiện thường xuyên trong đề thật, nhưng quy tắc \"phải trích nguyên văn\" của nó quan trọng đến mức cần học riêng.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 1</span>Vượt giới hạn số từ</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">Đáp án chuẩn là \"<b>(the) norm</b>\" — mạo từ \"the\" có thể có hoặc không, nhưng từ chính \"norm\" bắt buộc phải đúng và đủ.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 2 — quy tắc riêng quan trọng nhất</span>Tự diễn đạt lại thay vì trích nguyên văn</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đây chính là điều khiến Short Answer khác MỌI dạng khác mà em đã học: ở mọi dạng khác, diễn đạt lại đúng ý vẫn được tính điểm; còn ở đây, đáp án PHẢI là cụm từ GỐC xuất hiện trong bài — dù học sinh viết lại đúng ý đến đâu, nếu không trích đúng nguyên văn vẫn bị tính sai.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 3</span>Xác định sai LOẠI thông tin cần tìm</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Nếu không xác định trước đáp án cần là địa điểm, số lượng, tên riêng hay nguyên nhân, em rất dễ chọn nhầm một cụm từ khác ở gần đó, cùng chủ đề nhưng trả lời sai câu hỏi.</p>\n    <div class=\"exbox\">Dễ nhầm giữa \"what caused X\" (hỏi NGUYÊN NHÂN của X) và \"what did X cause\" (hỏi KẾT QUẢ do X gây ra) — hai câu hỏi gần giống hệt nhau về mặt từ ngữ nhưng hỏi ngược chiều nhau.</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 4</span>Từ khoá câu hỏi bị paraphrase</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <div class=\"exbox\">\"first appeared\" (câu hỏi) ↔ \"originated\" (bài); \"happened as a result of\" (câu hỏi) ↔ \"led to\" (bài).</div>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Bẫy 5</span>Lẫn giữa 2 biến thể của dạng này</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Đôi khi dạng này được lồng ghép thành trắc nghiệm 2-3 lựa chọn thay vì điền tự do hoàn toàn — em cần nhận diện đúng biến thể đang gặp để áp dụng kỹ thuật phù hợp.</p>\n    <p class=\"fixbox\">💡 Trước khi đọc bài: tự phân loại xem câu hỏi đang hỏi về CÁI GÌ (số lượng? địa điểm? tên riêng? hành động? nguyên nhân?). Và luôn nhắc lại nguyên tắc riêng của dạng này: đáp án luôn phải là từ/cụm NGUYÊN VĂN trong bài.</p>\n  </div></div>\n</div>\n\n<div class=\"note-card\">🏁 Vậy là em đã đi hết cả 10 dạng đề. Phần tiếp theo tổng hợp lại những nguyên tắc XUYÊN SUỐT mà em đã gặp đi gặp lại trong suốt 5 bài học vừa qua — nhìn lại chúng một lần cuối trước khi bước vào bài tổng ôn.</div>\n\n<div class=\"groupTitle\">MẸO CHUNG XUYÊN SUỐT MỌI DẠNG ĐỀ</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Mẹo 1</span>Từ khoá hầu như luôn bị paraphrase</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Xuyên suốt cả 4 bài trước, em đã gặp đi gặp lại một sự thật: không bao giờ nên dò tìm nguyên văn trong bài — phải luyện phản xạ nhận ra Ý giống nhau dù từ ngữ khác nhau. Đây là lý do ngân hàng paraphrase ở Bài 1 áp dụng cho MỌI dạng đề, không chỉ riêng T/F/NG.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Mẹo 2</span>Giới hạn số từ = lỗi mất điểm oan phổ biến nhất</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Xuất hiện ở 5 trong 10 dạng đề (các dạng Completion, Summary, Sentence Completion, Short Answer...) — luôn xác định rõ giới hạn TRƯỚC khi đi tìm đáp án, không phải sau khi điền xong.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Mẹo 3 — bẫy nguy hiểm nhất xuyên suốt cả 5 bài</span>\"Từ quen sai chỗ\"</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Nếu phải chọn MỘT nguyên tắc quan trọng nhất trong toàn bộ 5 bài học, đây chính là nó: bẫy nguy hiểm nhất không phải \"từ lạ\" mà là <b>\"từ quen sai chỗ\"</b>. Multiple Choice (Bài 2), Matching Headings (Bài 4), và Sentence Completion (Bài 3) đều có bẫy lấy đúng từ/ý CÓ THẬT trong bài nhưng gán cho sai đối tượng, sai đoạn, hoặc sai câu hỏi. Đây là bẫy khó nhất vì cảm giác \"quen\" khiến ta mất cảnh giác và chọn ngay mà không xác nhận lại ngữ cảnh.</p>\n  </div></div>\n</div>\n\n<div class=\"acc\">\n  <div class=\"acc-h\"><span><span class=\"tag\">Mẹo 4</span>Cấu trúc câu phức hay che giấu đáp án</span><span class=\"chev\">▾</span></div>\n  <div class=\"acc-body\"><div class=\"acc-inner\">\n    <p>Dấu gạch ngang (–), mệnh đề phân từ rút gọn ở đầu câu, cấu trúc \"not only...but also\", \"so...that\" — tất cả đều xuất hiện lặp lại ở nhiều dạng khác nhau trong 5 bài vừa qua. Nên luyện đây thành một kỹ năng ĐỌC riêng biệt, áp dụng cho mọi dạng đề, không chỉ gắn với một dạng cụ thể nào.</p>\n  </div></div>\n</div>\n\n<div class=\"groupTitle\">BẢNG TRA NHANH — 10 DẠNG ĐỀ TRƯỚC KHI THỰC CHIẾN</div>\n<div class=\"card\">\n  <table class=\"vt\">\n    <tr><th>Dạng đề</th><th>Dấu hiệu nhận biết nhanh</th></tr>\n    <tr><td>True/False/Not Given</td><td>Kiểm tra SỰ KIỆN khách quan trong bài tường thuật</td></tr>\n    <tr><td>Yes/No/Not Given</td><td>Kiểm tra Ý KIẾN tác giả trong bài tranh luận</td></tr>\n    <tr><td>Multiple Choice</td><td>4+ lựa chọn A-D, có thể hỏi chi tiết hoặc ý chính</td></tr>\n    <tr><td>Note/Table/Flow-chart/Diagram</td><td>Điền từ vào ghi chú/bảng/sơ đồ, luôn có giới hạn số từ</td></tr>\n    <tr><td>Summary Completion</td><td>Đoạn tóm tắt có chỗ trống, có/không ngân hàng từ</td></tr>\n    <tr><td>Sentence Completion</td><td>Hoàn thành câu — chọn vế câu hoặc tự điền từ</td></tr>\n    <tr><td>Matching Headings</td><td>Nối đoạn văn ↔ tiêu đề, số tiêu đề luôn nhiều hơn số đoạn</td></tr>\n    <tr><td>Matching Information</td><td>Tìm đoạn chứa 1 chi tiết cụ thể, được dùng lại chữ cái</td></tr>\n    <tr><td>Matching Features</td><td>Nối đặc điểm ↔ tên người/tổ chức cụ thể</td></tr>\n    <tr><td>Short Answer Questions</td><td>Trả lời bằng từ nghi vấn, đáp án phải trích nguyên văn</td></tr>\n  </table>\n</div>\n<div class=\"note-card\">🏁 <b>Em đã đi qua toàn bộ \"luật chơi\" của 10 dạng đề, theo đúng trình tự từ Bài 1 đến Bài 5.</b> Bài tổng ôn ở tab \"Luyện nhận diện\" sẽ trộn ngẫu nhiên tình huống của cả 10 dạng — làm tốt bài này nghĩa là em đã sẵn sàng bước vào làm đề thật.</div>\n";

đoạn này.", "Đúng — đây chính là triết lý xuyên suốt: \"hiểu luật chơi trước khi vào chơi\", rồi mới luyện số lượng.", "Luyện số lượng mà không hiểu bẫy dễ lặp lại lỗi sai liên tục.", "Tốc độ chỉ nên ưu tiên sau khi đã chắc về độ chính xác và nhận diện bẫy."]}];

var answered = new Array(QUIZ.length).fill(false);
var firstChoice = new Array(QUIZ.length).fill(-1);

function enterLesson(){
  var v = $("nameInput").value.trim();
  if(!v){ $("nameInput").focus(); return; }
  studentName = v;
  $("gate").hidden = true;
  $("appRoot").hidden = false;
  $("tabs").hidden = false;
  renderRead();
}
$("enterBtn").addEventListener("click", enterLesson);
$("nameInput").addEventListener("keydown", function(e){ if(e.key === "Enter") enterLesson(); });

function switchTab(name){
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === name); });
  $("tab-read").hidden = name !== "read";
  $("tab-quiz").hidden = name !== "quiz";
  if(name === "quiz") renderQuiz();
}
$("tabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  switchTab(btn.dataset.tab);
});

var readRendered = false;
function renderRead(){
  if(readRendered) return;
  readRendered = true;
  var root = $("tab-read");
  root.innerHTML = READ_HTML;
  root.querySelectorAll(".acc-h").forEach(function(h){
    h.addEventListener("click", function(){
      h.closest(".acc").classList.toggle("open");
    });
  });
}

var quizRendered = false;
function renderQuiz(){
  if(quizRendered) return;
  quizRendered = true;
  var root = $("tab-quiz");
  var html = '<div class="card"><p style="color:var(--fg-dim)">Đọc kỹ rồi chọn đáp án. Lần chọn ĐẦU TIÊN được tính điểm — vẫn có thể chọn lại để xem giải thích và học thêm.</p></div>';
  QUIZ.forEach(function(item, i){
    html += '<div class="card qcard" data-qi="' + i + '">';
    html += '<div class="qtext">Câu ' + (i+1) + '. ' + item.q + '</div>';
    item.opts.forEach(function(opt, oi){
      html += '<label class="opt" data-oi="' + oi + '"><input type="radio" name="q' + i + '" value="' + oi + '"><span>' + opt + '</span></label>';
    });
    html += '<div class="fb" data-fb></div></div>';
  });
  html += '<div class="card" id="submitCard"><button class="primary" id="submitBtn" disabled>Nộp bài (0/' + QUIZ.length + ')</button></div>';
  root.innerHTML = html;

  root.querySelectorAll(".qcard").forEach(function(card){
    var qi = parseInt(card.dataset.qi, 10);
    card.querySelectorAll(".opt").forEach(function(label){
      label.addEventListener("click", function(){
        var oi = parseInt(label.dataset.oi, 10);
        if(!answered[qi]){ answered[qi] = true; firstChoice[qi] = oi; }
        label.querySelector("input").checked = true;
        var correctIdx = QUIZ[qi].a;
        card.querySelectorAll(".opt").forEach(function(l, li){
          l.classList.remove("correct","wrong");
          if(li === correctIdx) l.classList.add("correct");
          else if(li === oi) l.classList.add("wrong");
        });
        var fb = card.querySelector("[data-fb]");
        fb.textContent = QUIZ[qi].fb[oi];
        fb.className = "fb show " + (oi === correctIdx ? "good" : "bad");
        updateSubmitBtn();
      });
    });
  });
  updateSubmitBtn();
}

function updateSubmitBtn(){
  var done = answered.filter(Boolean).length;
  var btn = $("submitBtn");
  if(!btn) return;
  btn.textContent = "Nộp bài (" + done + "/" + QUIZ.length + ")";
  btn.disabled = done < QUIZ.length;
}

document.addEventListener("click", function(e){
  if(e.target && e.target.id === "submitBtn") submitQuiz();
});

function score(){
  var correct = 0;
  for(var i=0;i<QUIZ.length;i++){ if(firstChoice[i] === QUIZ[i].a) correct++; }
  return {correct: correct, total: QUIZ.length, pct: Math.round(correct/QUIZ.length*100)};
}

var SCRIPT_URL = "PASTE_SCRIPT_URL_HERE";

async function submitQuiz(){
  var s = score();
  var root = $("tab-quiz");
  var payload = { name: studentName, lesson: LESSON_ID, correct: s.correct, total: s.total, pct: s.pct, answers: firstChoice, submittedAt: new Date().toISOString() };
  var savedMsg = "";
  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    savedMsg = "Đã gửi kết quả cho giáo viên.";
  } catch(err){
    savedMsg = "Không gửi được tự động — em chụp màn hình kết quả gửi qua Zalo cho cô nhé.";
  }
  root.innerHTML = '<div class="card scorebox">'
    + '<div style="color:var(--fg-dim)">Kết quả của ' + escapeHtml(studentName) + '</div>'
    + '<div class="num">' + s.correct + '/' + s.total + '</div>'
    + '<div style="color:var(--fg-dim); margin-bottom:10px">(' + s.pct + '%)</div>'
    + '<p>' + (s.pct >= 75 ? 'Rất tốt! Em đã nắm chắc phần này. 🎉' : 'Em nên đọc lại tab "Đào sâu" một lần nữa trước khi làm đề thật nhé.') + '</p>'
    + '<p class="note">' + savedMsg + '</p>'
    + '</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
})();
</script>
